<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Personal QR</title>
  <!-- Enlace local idéntico a tu repositorio -->
  <script src="./html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #1565c0;
      margin-bottom: 20px;
    }
    /* Contenedores de Vistas */
    #vista-escaneo, .vista-resultado {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }
    #reader {
      width: 100%;
      min-height: 300px;
      margin: auto;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      min-height: 25px;
    }
    .green {
      background: #c8e6c9;
      color: #1b5e20;
    }
    .red {
      background: #ffcdd2;
      color: #b71c1c;
    }
    .orange {
      background: #ffe0b2;
      color: #e65100;
    }
    /* Tarjetas de Datos */
    .tarjeta-datos {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-top: 8px solid #1565c0;
      margin-top: 15px;
    }
    .tarjeta-devolver {
      border-top-color: #e65100;
    }
    .badge-estado {
      background: #e3f2fd;
      color: #0d47a1;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .badge-devolver {
      background: #fff3e0;
      color: #e65100;
    }
    .info-grupo {
      text-align: left;
      margin-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 6px;
    }
    .info-label {
      font-size: 12px;
      color: #757575;
      text-transform: uppercase;
      font-weight: bold;
    }
    .info-valor {
      font-size: 18px;
      color: #212121;
      font-weight: 500;
    }
    /* Input Estilizado */
    .campo-entrada {
      text-align: left;
      margin: 15px 0;
    }
    .campo-entrada label {
      font-size: 12px;
      font-weight: bold;
      color: #1565c0;
      text-transform: uppercase;
      display: block;
      margin-bottom: 5px;
    }
    .input-texto {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: 2px solid #1565c0;
      border-radius: 6px;
      box-sizing: border-box;
      font-weight: bold;
      text-align: center;
    }
    /* Imagen de la Cédula */
    .contenedor-foto {
      margin: 15px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
      border: 1px solid #ddd;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .foto-cedula {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    /* Botones */
    .btn-accion {
      color: white;
      padding: 15px 30px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn-asignar { background: #1565c0; margin-bottom: 10px; }
    .btn-asignar:hover { background: #0d47a1; }
    .btn-devolver { background: #e65100; }
    .btn-devolver:hover { background: #b23c17; }
    .btn-volver { background: #2e7d32; }
    .btn-volver:hover { background: #1b5e20; }
    .btn-cancelar { background: #757575; }


/*==========================
MENU PRINCIPAL
==========================*/

#vista-menu-principal{

    width:100%;
    max-width:700px;
    margin:auto;

}

.grid-botones{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

    gap:15px;

    margin-top:30px;

}

.btn-hoja{

    background:#1565c0;

    color:#fff;

    border:none;

    border-radius:10px;

    padding:25px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

}

.btn-hoja:hover{

    background:#0d47a1;

    transform:scale(1.03);

}

    
  </style>
</head>
<body>

<!-- =======================
MENÚ PRINCIPAL
======================= -->

<div id="vista-menu-principal">

    <h1>Seleccione Categoría</h1>

    <div id="contenedorHojas" class="grid-botones">
    </div>

</div>

<h1 id="tituloSistema" style="display:none;">
    Control de Personal QR
</h1>

<h2 id="nombreHojaSeleccionada"
    style="display:none;color:#1565c0;margin-top:-10px;">
</h2>

<!-- =======================
ESCÁNER
======================= -->

<div id="vista-escaneo" style="display:none;">

    <div id="menu-botones">

        <button class="btn-accion btn-asignar"
            onclick="activarModo('buscarAsignar')">
            REGISTRAR INGRESO
        </button>

        <button class="btn-accion btn-devolver"
            onclick="activarModo('devolver')">
            REGISTRAR SALIDA
        </button>

    </div>

    <br>

    <button
        id="btnCancelar"
        class="btn-accion btn-cancelar"
        style="display:none;margin-bottom:15px;"
        onclick="cancelarEscaneo()">

        CANCELAR

    </button>

    <div id="reader"></div>

    <div id="resultado"></div>

</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxK_Yc4glEV2SuEUJahDTFsatYH70fQthl7c2hfPgetVMphsoipFt9EwTlh_-onjmA4JA/exec";

let html5QrcodeScanner = null;
let procesandoScan = false;
let modoAccionActual = "";
let hojaSeleccionada = "";
let hojasSistema = [];


//==============================
// ERRORES GENERALES
//==============================

window.onerror = function(msg, url, linea) {

    const r = document.getElementById("resultado");

    if(r){
        r.className = "red";
        r.innerHTML =
            "Error interno: " + msg + " Línea: " + linea;
    }

    return false;
};


//==============================
// INICIO
//==============================

window.onload = function(){

    cargarHojas();

};


//==============================
// CARGAR CATEGORÍAS
//==============================

function cargarHojas(){

    const viejo = document.getElementById("jsonp-hojas");

    if(viejo)
        viejo.remove();


    const script = document.createElement("script");

    script.id = "jsonp-hojas";

    script.src =
        WEB_APP_URL +
        "?accion=obtenerHojas&callback=recibirHojas";


    document.body.appendChild(script);

}



window.recibirHojas = function(respuesta){


    if(!respuesta.ok){

        alert(respuesta.mensaje);
        return;

    }


    hojasSistema = respuesta.hojas;

    crearBotonesHojas();

};



//==============================
// CREAR BOTONES CATEGORÍAS
//==============================

function crearBotonesHojas(){

    const contenedor =
        document.getElementById("contenedorHojas");


    contenedor.innerHTML = "";


    hojasSistema.forEach(function(nombre){


        const boton =
            document.createElement("button");


        boton.className = "btn-hoja";

        boton.innerHTML = nombre;


        boton.onclick = function(){

            seleccionarHoja(nombre);

        };


        contenedor.appendChild(boton);


    });

}



//==============================
// SELECCIONAR HOJA
//==============================

function seleccionarHoja(nombre){


    hojaSeleccionada = nombre;


    document.getElementById("nombreHojaSeleccionada").innerHTML =
        "Categoría: <strong>" + nombre + "</strong>";


    document.getElementById("vista-menu-principal").style.display="none";

    document.getElementById("tituloSistema").style.display="block";

    document.getElementById("nombreHojaSeleccionada").style.display="block";

    document.getElementById("vista-escaneo").style.display="block";


}



//==============================
// VOLVER AL MENU
//==============================

function regresarAlMenuPrincipal(){


    procesandoScan = false;

    modoAccionActual = "";

    hojaSeleccionada = "";


    document.getElementById("resultado").innerHTML="";
    document.getElementById("resultado").className="";


    document.getElementById("btnCancelar").style.display="none";

    document.getElementById("menu-botones").style.display="block";


    document.getElementById("vista-escaneo").style.display="none";

    document.getElementById("tituloSistema").style.display="none";

    document.getElementById("nombreHojaSeleccionada").style.display="none";


    document.getElementById("vista-menu-principal").style.display="block";


}



//==============================
// ACTIVAR INGRESO / SALIDA
//==============================

function activarModo(modo){


    modoAccionActual = modo;


    document.getElementById("menu-botones").style.display="none";

    document.getElementById("btnCancelar").style.display="inline-block";


    iniciarVideoTransmision();


}



//==============================
// INICIAR CAMARA
//==============================

function iniciarVideoTransmision(){


    const r = document.getElementById("resultado");


    r.className="";

    r.innerHTML="Activando cámara...";


    html5QrcodeScanner =
        new Html5Qrcode("reader");


    html5QrcodeScanner.start(

        {
            facingMode:"environment"
        },

        {},

        codigoDetectadoEnVivo


    )

    .then(()=>{


        r.className="green";

        r.innerHTML =
            "Cámara activa. Escanee el QR.";


    })


    .catch(error=>{


        r.className="red";

        r.innerHTML =
            "Error cámara: " + error;


        document.getElementById("menu-botones").style.display="block";

    });


}



//==============================
// QR DETECTADO
//==============================

function codigoDetectadoEnVivo(decodedText){


    if(procesandoScan)
        return;


    procesandoScan=true;


    const r =
        document.getElementById("resultado");


    r.className="";

    r.innerHTML="Registrando...";


    html5QrcodeScanner.stop()

    .then(()=>{


        const viejo =
            document.getElementById("jsonp-request");


        if(viejo)
            viejo.remove();



        const script =
            document.createElement("script");


        script.id="jsonp-request";


        script.src =
            WEB_APP_URL +

            "?codigoQR=" +
            encodeURIComponent(decodedText) +

            "&accion=" +
            encodeURIComponent(modoAccionActual) +

            "&hoja=" +
            encodeURIComponent(hojaSeleccionada) +

            "&callback=procesarRespuestaServidorJSONP";


        script.onerror=function(){

            mostrarError("Error de conexión.");

        };


        document.body.appendChild(script);



    });


}



//==============================
// RESPUESTA GOOGLE APPS SCRIPT
//==============================

window.procesarRespuestaServidorJSONP=function(data){



    const r =
        document.getElementById("resultado");


    if(data.ok){


        r.className="green";

        r.innerHTML =
            "<strong>" +
            data.mensaje +
            "</strong>";



        setTimeout(function(){


            if(modoAccionActual=="buscarAsignar"){


                procesandoScan=false;

                iniciarVideoTransmision();


            }else{


                regresarAlMenuPrincipal();


            }


        },2000);



    }else{


        r.className="red";

        r.innerHTML =
            "<strong>" +
            data.mensaje +
            "</strong>";


        setTimeout(function(){


            procesandoScan=false;

            iniciarVideoTransmision();


        },3000);



    }


};



//==============================
// ERROR SERVIDOR
//==============================

function mostrarError(mensaje){


    const r =
        document.getElementById("resultado");


    r.className="red";

    r.innerHTML =
        mensaje;


    procesandoScan=false;

}



//==============================
// CANCELAR
//==============================

function cancelarEscaneo(){


    if(html5QrcodeScanner){


        html5QrcodeScanner.stop()

        .then(()=>{

            regresarAlMenuPrincipal();

        })

        .catch(()=>{

            regresarAlMenuPrincipal();

        });


    }else{


        regresarAlMenuPrincipal();

    }


}


</script>
